project:
  type: website
  render: ["*.qmd", "conferences/*.qmd"]

website:
  title: "Non-Equilibrium Molecular Dynamics"
  site-url: https://non-equilibrium-molecular-dynamics.github.io
  favicon: images/favicon.png
  search: false
  navbar:
    title: "NEMD"
    background: light
    left:
      - text: "Conferences"
        href: conferences.qmd
      - text: "Summer School"
        href: summer-school.qmd
      - text: "People"
        href: people.qmd
      - text: "About"
        href: about.qmd
    right:
      - text: "Join the mailing list"
        href: "mailto:contact.nemd@gmail.com?subject=subscribe"
  page-footer:
    center: >
      <a href="mailto:contact.nemd@gmail.com">contact.nemd@gmail.com</a> &middot;
      <a href="https://github.com/Non-Equilibrium-Molecular-Dynamics">GitHub</a>

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    link-external-newwindow: true
    anchor-sections: false
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fira+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
        <meta name="theme-color" content="#ede7d8">
        <script>document.addEventListener('DOMContentLoaded',function(){var a=document.createElement('a');a.className='skip-link';a.href='#quarto-document-content';a.textContent='Skip to content';document.body.insertBefore(a,document.body.firstChild);});</script>
